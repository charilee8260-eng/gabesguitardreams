<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Gabriel's Guitar Dreams</title>

    :root {
      --bg: #0f172a;
      --card: #ffffff;
      --accent: #6366f1;
      --accent-soft: #e0e7ff;
      --accent-dark: #4f46e5;
      --text-main: #0f172a;
      --text-soft: #6b7280;
      --border-soft: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%);
      color: #f9fafb;
    }

    header {
      padding: 24px 16px 32px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    header p {
      margin-top: 10px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      color: #e5e7eb;
      font-weight: 300;
    }

    .pill {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.5);
      color: #e5e7eb;
      margin-bottom: 10px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto 32px;
      padding: 0 16px 16px;
    }

    .hero-card {
      background: linear-gradient(135deg, rgba(15,23,42,0.98), rgba(30,64,175,0.96));
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.4);
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2.5fr);
      gap: 16px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .hero-card {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .hero-text h2 {
      font-size: 1.6rem;
      margin: 0 0 10px;
    }

    .hero-text p {
      margin: 0 0 12px;
      color: #e5e7eb;
      font-weight: 300;
      line-height: 1.6;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      font-size: 0.8rem;
      color: #cbd5f5;
    }
